name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build-push:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push)
        uses: docker/build-push-action@v7
        with:
          context: https://github.com/unslothai/llama.cpp#efc8bc38f0a9950cbb10ccef2cf48b951c39d3b2
          file: .devops/cuda.Dockerfile
          target: server
          build-args: |
            CUDA_DOCKER_ARCH=120
          tags: |
            ghcr.io/ciffelia/llama.cpp-kimi-k3:server-cuda
            ghcr.io/ciffelia/llama.cpp-kimi-k3:server-cuda-git-${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/main' }}
